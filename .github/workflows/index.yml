name: Catalogue index

on:
  push:
    branches: [main]
    paths:
      - "setups/**"
      - "verified.json"
      - "tools/build_index.py"
      - ".github/workflows/index.yml"
  pull_request:
    paths:
      - "setups/**"
      - "tools/build_index.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every setup
        run: python3 tools/build_index.py --check

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild index.json
        run: python3 tools/build_index.py
      - name: Commit the index when it changed
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git push
